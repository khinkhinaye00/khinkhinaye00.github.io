<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <h1>Focus</h1>

<form>
    <div id="myData">
        <label for="name">Name</label>
        <input type="text" name="name" id="name">
        <br><br>

        <label for="">Gender</label>
        <br><br>

        <input type="radio" value="Male" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" value="Female" id="Female" name="gender">
        <label for="female">Female</label>
        <br><br>

        <label for="">Hobbies</label>
        <br>

        
            <input type="checkbox" name="hobbies[]" value="Reading" id="reading"> 
            <label for="reading">Reading</label>
            <br>
        
            <input type="checkbox" name="hobbies[]" value="Travelling" id="travelling"> 
            <label for="travelling">Travelling</label>
            <br>
        
            <input type="checkbox" name="hobbies[]" value="Swimming" id="swimming"> 
            <label for="swimming">Swimming</label>
            <br>
        
            <input type="checkbox" disabled="dancing" name="hobbies[]" value="Dancing" id="dancing"> 
            <label for="dancing">Dancing</label>
            <br>

        
            <label for="fName">Father Name</label>
            <input type="text" value="U Maung Nyo" id="fName" readonly>
            <br>
    </div>
</form>
</body>
</html>
